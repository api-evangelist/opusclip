aid: opusclip
name: OpusClip
description: >-
  OpusClip (opus.pro), operated by Opusclip Inc. of Mountain View, California, is
  an AI video platform used by 16M+ creators and businesses. It spans two products:
  OpusClip, an AI video-clipping tool that turns long-form videos into viral short
  clips with animated captions, AI reframing, virality scoring, AI B-roll, and
  multi-platform scheduling; and Agent Opus, an end-to-end AI video agent. OpusClip
  ships a public REST "Clip API" (https://api.opus.pro) authenticated with Bearer
  API keys, a hosted MCP server exposing 26 tools, a bundled CLI, a published Agent
  Skill, webhooks signed with HMAC-SHA256, an OpenAPI 3.0 spec, llms.txt, and
  security.txt. API access requires an Enterprise, Pro (Beta), or Max plan.
